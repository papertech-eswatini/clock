<!doctype html>
<!-- PTE 看板主畫面入口。放 GitHub Pages：papertech-eswatini.github.io/clock/dash/

<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PTE看板</title>
<meta name="apple-mobile-web-app-title" content="PTE看板">
<meta name="application-name" content="PTE看板">
<meta name="theme-color" content="#2C2C2A">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<script>
var DASH = 'https://script.google.com/a/macros/papertecheswatini.net/s/AKfycbyYkvfOCnRDyXTrTpzt4u8hzcscx3PtStV4eZ5PiXcWsTBz-6mc85tGuOuQBdWHjw_twA/exec';
if (/[?&]go=1/.test(location.search) || navigator.standalone) location.replace(DASH);

<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#2C2C2A;color:#fff;font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;text-align:center}
.w{padding:24px 16px;max-width:360px}
img{width:96px;height:96px;border-radius:22px}
a.b{display:block;margin:24px 0 20px;padding:14px;border-radius:12px;background:#EF9F27;color:#2C2C2A;text-decoration:none;font-size:17px;font-weight:600}
p{margin:6px 0;color:#D3D1C7;font-size:14px;line-height:1.6}

<body>
<div class="w">
  <img src="icon-180.png" alt="PTE">
  <a class="b" id="go" href="#">打開看板 Open dashboard</a>
  <p>加到主畫面：iPhone 按分享 → 加入主畫面；Android 按選單 → 加到主畫面。</p>
  <p>Add to home screen: iPhone Share → Add to Home Screen; Android menu → Add to Home screen.</p>
